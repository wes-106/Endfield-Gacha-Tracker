name: gacha_record
description: "跨平台《明日方舟：終末地》尋訪紀錄匯出、同步與分析工具。"

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  http: ^1.6.0
  screenshot: ^3.0.0
  path_provider: ^2.1.6
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  url_launcher: ^6.3.3
  image_gallery_saver_plus: ^5.1.1
  shared_preferences: ^2.5.6
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1



flutter:
  uses-material-design: true


flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/app_icon.png"